<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=2">
    <style>
        /* Fallback styles */
        body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: white; }
        .container { max-width: 500px; margin: 40px auto; background: rgba(255,255,255,0.1); padding: 40px; border-radius: 20px; }
        h2 { text-align: center; color: #00c6ff; margin-bottom: 2rem; }
        form { background: rgba(255,255,255,0.08); padding: 2rem; border-radius: 15px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 10px; border: none; background: rgba(255,255,255,0.2); color: white; }
        button { background: #00c6ff; color: white; padding: 15px; border: none; border-radius: 25px; width: 100%; font-size: 16px; cursor: pointer; margin-top: 1rem; }
        nav { background: rgba(0,0,0,0.8); padding: 15px; text-align: center; }
        nav a { color: #00c6ff; text-decoration: none; margin: 0 20px; padding: 8px 16px; border-radius: 20px; }
        nav a:hover { background: rgba(0,198,255,0.1); }
    </style>
</head>
<body class="bg-dark text-light register-page">
    <nav class="nav-container">
        <a href="/">Home</a>
        <a href="/index">Calculator</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/login">Login</a>
    </nav>

<div class="container mt-5">
    <h2>Create Account</h2>
    <form method="POST">
        <div class="mb-3">
            <label>Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button class="btn btn-success">Register</button>
    </form>
    <br>
    <a href="login.html" class="text-light">Already have an account? Login</a>
</div>

</body>
</html>
