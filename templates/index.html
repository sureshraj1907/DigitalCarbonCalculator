<!DOCTYPE html>
<html>
<head>
    <title>Digital Carbon Footprint Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=2">
    <style>
        /* Fallback styles in case CSS doesn't load */
        body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: white; font-family: Arial, sans-serif; }
        .container { max-width: 800px; margin: 40px auto; background: rgba(255,255,255,0.1); padding: 40px; border-radius: 20px; }
        h1 { text-align: center; color: #00c6ff; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 10px; border: none; background: rgba(255,255,255,0.2); color: white; }
        button { background: #00c6ff; color: white; padding: 15px; border: none; border-radius: 25px; width: 100%; font-size: 16px; cursor: pointer; }
        nav { background: rgba(0,0,0,0.8); padding: 15px; text-align: center; }
        nav a { color: #00c6ff; text-decoration: none; margin: 0 20px; padding: 8px 16px; border-radius: 20px; }
        nav a:hover { background: rgba(0,198,255,0.1); }
    </style>
</head>

<body class="calculator-page">

    <div class="container">
        <nav class="nav-container">
            <a href="/">Home</a>
            <a href="/index">Calculator</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/login">Login</a>
        </nav>
        <h1> Digital Carbon Footprint Calculator</h1>

        <form action="/calculate" method="POST">

            <label>Car Travel (km per day)</label>
            <input type="number" name="car" required>

            <label>Internet Usage (hours per day)</label>
            <input type="number" name="internet" required>

            <label>Mobile Usage (hours per day)</label>
            <input type="number" name="mobile" required>

            <label>Streaming (hours per day)</label>
            <input type="number" name="streaming" required>

            <label>Gaming (hours per day)</label>
            <input type="number" name="gaming" required>

            <label>Social Media (hours per day)</label>
            <input type="number" name="social" required>

            <label>Laptop Usage (hours per day)</label>
            <input type="number" name="laptop" required>

            <button type="submit">Calculate Monthly Footprint</button>

        </form>

        <div class="note">
            * All digital usage values are considered as daily average.  
            Monthly carbon footprint is estimated automatically.
        </div>

    </div>

</body>
</html>
